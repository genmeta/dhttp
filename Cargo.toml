[workspace]
resolver = "3"
members = ["dhttp", "identity", "home", "api", "access"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = "1"
dirs = "6"
snafu = "0.9"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
matchit = "0.9"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1" }
toml = "1"
tower-service = "0.3"
tracing = "0.1"
x509-parser = "0.18"
bon = "3"
http = "1"
serde_json = "1"
sea-orm-migration = { version = "1", features = ["runtime-tokio-rustls"] }
sea-orm = { version = "1", features = ["runtime-tokio-rustls"] }
regex = "1"
peg = "0.8"
globset = "0.4"
derive_more = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

# Keep workspace-local identity/home crates as path dependencies.
# They are part of this workspace's public type surface; resolving them through
# the git dhttp repository while building this workspace would create duplicate
# crate instances and incompatible types. This is workspace-local only:
# downstream crates that depend on `dhttp` via git do not inherit it.
dhttp-identity = { path = "identity" }
dhttp-home = { path = "home" }
ddns = { git = "https://github.com/genmeta/ddns.git", branch = "endpoint", features = ["h3x-resolver", "mdns-resolver", "http-resolver"] }
h3x = { git = "https://github.com/genmeta/h3x.git", features = ["dquic"], branch = "endpoint" }
dhttp = { path = "dhttp" }
dhttp-access = { path = "access" }

# Workspace-local identity/home unification.
# The dhttp workspace exposes these crates as part of the same public type
# surface. Transitive git dependencies (for example h3x/ddns) may also depend
# on dhttp-identity or dhttp-home; while building this workspace, patch those
# git crates back to the local members so all code sees the same concrete
# types. Cargo patches are root-only, so downstream crates that depend on
# `dhttp` via git do not inherit this override.
[patch."https://github.com/genmeta/dhttp.git"]
dhttp-identity = { path = "identity" }
dhttp-home = { path = "home" }
