[workspace]
resolver = "3"
members = ["dhttp", "home", "access", "log", "api"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/dhttp"
readme = "README.md"
keywords = ["dhttp", "http3", "quic", "identity", "network"]
categories = ["network-programming"]

[workspace.dependencies]
bytes = "1"
dirs = "7"
snafu = "0.9"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
netwatcher = { version = "0.8", features = ["tokio"] }
matchit = "0.9"
rustls = { package = "qrustls", version = "0.23.45", default-features = false }
tokio = { version = "1" }
toml = "1"
tower-service = "0.3"
tracing = "0.1"
x509-parser = "0.18"
bon = "3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls"] }
sea-orm = { version = "2", features = ["runtime-tokio-rustls"] }
regex = "1"
regex-automata = "0.4"
peg = "0.8"
globset = "0.4"
derive_more = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Release dependencies use compatible crates.io versions.
qbase = { version = "0.7.0" }
qconn = { version = "0.9.0", package = "qconnection" }
qtransport = { version = "0.1.0" }
qprotocol = { version = "0.7.0" }
qresolve = { version = "0.9.0" }
qudp = { version = "0.8.1" }
qrecovery = { version = "0.7.0" }
qtls = { version = "0.1.0" }
h3x = { version = "0.7.0" }
dhttp-home = { path = "home", version = "0.6.1", default-features = false }
dhttp = { path = "dhttp", version = "0.7.1" }
dhttp-access = { path = "access", version = "0.5.0" }
dhttp-log = { path = "log", version = "0.2.0" }
