[workspace]
resolver = "3"
members = ["dhttp", "home", "access", "log", "api"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/dhttp"
readme = "README.md"
keywords = ["dhttp", "http3", "quic", "identity", "network"]
categories = ["network-programming"]

[workspace.dependencies]
bytes = "1"
dirs = "6"
snafu = "0.9"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
netwatcher = { version = "0.8", features = ["tokio"] }
matchit = "0.9"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1" }
toml = "1"
tower-service = "0.3"
tracing = "0.1"
x509-parser = "0.18"
bon = "3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls"] }
sea-orm = { version = "2", features = ["runtime-tokio-rustls"] }
regex = "1"
regex-automata = "0.4"
peg = "0.8"
globset = "0.4"
derive_more = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Pin the validated transport snapshot for reproducible integration.
qbase = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qconn = { package = "qconnection", git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qtransport = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qprotocol = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qresolve = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qudp = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qrecovery = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qtls = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
h3x = { git = "https://github.com/genmeta/h3x.git", rev = "274af16707698fac6c6ff8bc9f2c112d9cf1fdba", version = "0.6.2" }
dhttp-home = { path = "home", version = "0.5.0", default-features = false }
dhttp = { path = "dhttp", version = "0.6.2" }
dhttp-access = { path = "access", version = "0.4.2" }
dhttp-log = { path = "log", version = "0.1.0" }

# Share the pinned QUIC types with registry dependencies.
[patch.crates-io]
qbase = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
qrecovery = { git = "https://github.com/genmeta/dquic.git", rev = "1cab7042ddbb4ae65b424cae81a91f88d4eaaaeb" }
