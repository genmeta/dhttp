[workspace]
resolver = "3"
members = ["dhttp", "identity", "home"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = "1"
dirs = "6"
snafu = "0.9"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1" }
toml = "1"
x509-parser = "0.18"
bon = "3"
http = "1"
tower-service = "0.3"

# Keep workspace-local identity/home crates as path dependencies.
# They are part of this workspace's public type surface; resolving them through
# the git dhttp repository while building this workspace would create duplicate
# identity/home crate instances and incompatible types. This is workspace-local
# only: downstream crates that depend on `dhttp` via git do not inherit it.
dhttp-identity = { path = "identity" }
home = { package = "dhttp-home", path = "home" }
ddns = { git = "ssh://git@github.com/genmeta/ddns.git", branch = "endpoint", features = ["h3x-resolver", "mdns-resolver", "http-resolver"] }
h3x = { git = "https://github.com/genmeta/h3x.git", features = ["dquic"], branch = "endpoint" }
