[workspace]
resolver = "3"
members = ["dhttp", "identity", "home", "access", "log"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/genmeta/dhttp"
readme = "README.md"
keywords = ["dhttp", "http3", "quic", "identity", "network"]
categories = ["network-programming"]

[workspace.dependencies]
bytes = "1"
dirs = "6"
snafu = "0.9"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
matchit = "0.9"
rustls = { version = "0.23", default-features = false }
tokio = { version = "1" }
toml = "1"
tower-service = "0.3"
tracing = "0.1"
x509-parser = "0.18"
bon = "3"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1"
sea-orm-migration = { version = "2", features = ["runtime-tokio-rustls"] }
sea-orm = { version = "2", features = ["runtime-tokio-rustls"] }
regex = "1"
regex-automata = "0.4"
peg = "0.8"
globset = "0.4"
derive_more = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Definition-stage integration with the adjacent dquic dev workspace.
qbase = { path = "../dquic/qbase" }
qconn = { path = "../dquic/qconn" }
qtransport = { path = "../dquic/qtransport" }
qprotocol = { path = "../dquic/qprotocol" }
qrecovery = { path = "../dquic/qrecovery" }
qtls = { path = "../dquic/qtls" }
h3x = { path = "../h3x" }
# Legacy workspace consumers still depend on these crates pending migration.
dhttp-identity = "0.3.0"
dhttp-home = { path = "home", version = "0.5.0" }
dhttp = { path = "dhttp", version = "0.6.2" }
dhttp-access = { path = "access", version = "0.4.2" }
dhttp-log = { path = "log", version = "0.1.0" }
