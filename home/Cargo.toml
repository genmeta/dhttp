[package]
name = "dhttp-home"
description = "Local identity home and profile management for DHttp"
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/dhttp_home.rs"

[dependencies]
dirs = { workspace = true }
snafu = { workspace = true }

futures = { workspace = true, optional = true }
rustls = { workspace = true, features = ["ring", "std"], optional = true }
tokio = { workspace = true, features = ["fs"], optional = true }
x509-parser = { workspace = true, optional = true }
ring = { version = "0.17", optional = true }

[features]
default = ["ssl"]
ssl = ["dep:tokio", "dep:futures", "dep:rustls", "dep:x509-parser", "dep:ring"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
