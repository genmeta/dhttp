[package]
name = "dhttp"
description = "The True Internet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
access = ["dep:dhttp-access"]
log = ["dep:dhttp-log"]
access-cli = ["access", "dhttp-access/cli"]
access-http = ["access", "dhttp-access/http"]
access-orm = ["access", "dhttp-access/orm"]
access-migration = ["access-orm", "dhttp-access/migration"]
access-peg-trace = ["access", "dhttp-access/peg-trace"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
h3x.workspace = true
qbase = { workspace = true }
qconn = { workspace = true }
qtransport = { workspace = true }
qprotocol = { workspace = true }
qrecovery = { workspace = true }
tokio = { workspace = true, features = ["io-util", "sync"] }
tower-service.workspace = true
qtls = { workspace = true }
dhttp-access = { workspace = true, optional = true }
dhttp-log = { workspace = true, optional = true }

[build-dependencies]
rustls-pemfile = "2"
url = "2"
x509-parser.workspace = true

[dev-dependencies]
rcgen = "0.14"
rustls-pemfile = "2"
tokio = { workspace = true, features = ["macros", "rt"] }
url = "2"
x509-parser.workspace = true
