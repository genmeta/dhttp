name: Publish npm

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: macos-15-intel
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: api

      - name: Build native package
        run: npm run build:release
        working-directory: api

      - name: Smoke test native package
        run: npm run smoke
        working-directory: api

      - uses: actions/upload-artifact@v4
        with:
          name: npm-native-${{ matrix.os }}
          path: |
            api/*.node
            api/index.js
            api/index.d.ts

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-native-*
          path: api
          merge-multiple: true

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: api

      - name: Smoke test package
        run: npm run smoke
        working-directory: api

      - name: Dry-run npm publish
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: npm publish --dry-run --ignore-scripts --access public
        working-directory: api

  publish:
    needs: package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-native-*
          path: api
          merge-multiple: true

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: api

      - name: Smoke test package
        run: npm run smoke
        working-directory: api

      - name: Probe npm registry publish eligibility
        id: probe
        shell: bash
        working-directory: api
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm view "$package_name" version --json > /tmp/npm-existing.json 2> /tmp/npm-existing.err; then
            echo "package_exists=true" >> "$GITHUB_OUTPUT"
          else
            if grep -qiE 'E404|404 Not Found|Not Found|no such package' /tmp/npm-existing.err; then
              echo "package_exists=false" >> "$GITHUB_OUTPUT"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "skip_reason=package-missing" >> "$GITHUB_OUTPUT"
              echo "skip npm publish for $package_name@$package_version (package not yet initialized on npm)"
              exit 0
            fi

            cat /tmp/npm-existing.err >&2
            exit 1
          fi

          if npm view "$package_name@$package_version" version --json > /tmp/npm-target.json 2> /tmp/npm-target.err; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=version-exists" >> "$GITHUB_OUTPUT"
            echo "skip npm publish for $package_name@$package_version (version already published)"
            exit 0
          fi

          if grep -qiE 'E404|404 Not Found|Not Found|no such package|No match found' /tmp/npm-target.err; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "publish npm package $package_name@$package_version"
            exit 0
          fi

          cat /tmp/npm-target.err >&2
          exit 1

      - name: Publish npm package
        if: steps.probe.outputs.should_publish == 'true'
        run: npm publish --ignore-scripts --access public --provenance
        working-directory: api
