name: Publish PyPI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path api/Cargo.toml
          sccache: true

      - name: Smoke test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --target wheel-smoke dist/*.whl
          PYTHONPATH=wheel-smoke python - <<'PY'
          import dhttpy
          import dhttpy._native

          if not hasattr(dhttpy, "Endpoint"):
              raise SystemExit("missing dhttpy.Endpoint")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-dist-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

  publish:
    needs: check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-dist-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe PyPI publish eligibility
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          output = Path(os.environ["GITHUB_OUTPUT"])
          package_name = "dhttpy"
          wheels = sorted(Path("dist").glob("dhttpy-*.whl"))
          if not wheels:
              raise SystemExit("failed to find built dhttpy wheel in dist/")

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")

          package_version = None
          for line in metadata.splitlines():
              if line.startswith("Version: "):
                  package_version = line.split(": ", 1)[1]
                  break

          if package_version is None:
              raise SystemExit(f"failed to determine wheel version from {wheel.name}")

          # PyPI does not have a mutable `latest` pointer like npm. Normal pip
          # installs avoid prereleases unless users opt in with --pre or pin an
          # exact prerelease version, but keep CI logs explicit for release review.
          is_prerelease = bool(re.search(r"(?i)(?:^|[0-9_.!+-])(?:a|b|rc)\d+|\.dev\d*", package_version))
          release_channel = "preview" if is_prerelease else "stable"
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"release_channel={release_channel}\n")
              handle.write(f"prerelease={str(is_prerelease).lower()}\n")
          print(f"PyPI package {package_name} {package_version} is classified as {release_channel}")

          headers = {"User-Agent": "genmeta dhttp publish workflow"}
          package_url = f"https://pypi.org/pypi/{package_name}/json"
          request = urllib.request.Request(package_url, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"unexpected PyPI status for {package_name}: {response.status}")
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  with output.open("a", encoding="utf-8") as handle:
                      handle.write("should_publish=false\n")
                      handle.write("skip_reason=package-missing\n")
                  print(f"skip PyPI publish for {package_name} {package_version} (package not yet initialized on PyPI)")
                  raise SystemExit(0)
              raise

          releases = payload.get("releases", {})
          if package_version in releases:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("should_publish=false\n")
                  handle.write("skip_reason=version-exists\n")
              print(f"skip PyPI publish for {package_name} {package_version} (version already published)")
          else:
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("should_publish=true\n")
                  handle.write("skip_reason=\n")
              print(f"publish PyPI package {package_name} {package_version}")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.probe.outputs.should_publish == 'true'
        with:
          packages-dir: dist
