name: Release PyPI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path api/Cargo.toml
          sccache: true

      - name: Smoke test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --target wheel-smoke dist/*.whl
          PYTHONPATH=wheel-smoke python - <<'PY'
          import dhttp
          import dhttp._native

          if not hasattr(dhttp, "Endpoint"):
              raise SystemExit("missing dhttp.Endpoint")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-dist-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

  publish:
    needs: check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist