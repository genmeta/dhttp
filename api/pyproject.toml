[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "dhttpy"
dynamic = ["version"]
description = "DHTTP HTTP/3 SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "dhttpy._native"
features = ["pyo3", "pyo3/extension-module"]
