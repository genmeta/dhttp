[package]
name = "dhttp-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared asynchronous SDK bridge for DHTTP language bindings"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]
pyo3 = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[dependencies]
bytes.workspace = true
dhttp.workspace = true
dhttp-home = { workspace = true, features = ["ssl"] }
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
h3x.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-service.workspace = true
tracing.workspace = true
serde_json.workspace = true
qtls.workspace = true
rustls-pemfile = "2"
napi = { version = "3.9.0", default-features = false, features = ["napi4", "async", "dyn-symbols", "tokio_rt"], optional = true }
napi-derive = { version = "3.5.6", optional = true }
pyo3 = { version = "0.29.0", optional = true }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
async-stream = "0.3"
qtls.workspace = true
qprotocol.workspace = true
rustls-pemfile = "2"
scopeguard = "1"
tokio = { workspace = true, features = ["test-util"] }
