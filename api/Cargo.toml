[package]
name = "dhttp-api"
version.workspace = true
edition.workspace = true

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]
pyo3 = ["dep:pyo3", "dep:pyo3-async-runtimes"]

[dependencies]
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }
tower-service = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
dhttp = { workspace = true }
futures = { workspace = true }
snafu = { workspace = true }
napi = { version = "3.9.0", default-features = false, features = ["napi4", "async", "dyn-symbols"], optional = true }
napi-derive = { version = "3.5.6", optional = true }
pyo3 = { version = "0.28.3", features = ["experimental-async"], optional = true }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
trybuild = "1"
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
